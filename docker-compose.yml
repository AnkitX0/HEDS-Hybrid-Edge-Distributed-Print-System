version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: heds-postgres
    restart: always
    environment:
      POSTGRES_USER: heds_user
      POSTGRES_PASSWORD: heds_secure_password
      POSTGRES_DB: heds_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heds_user -d heds_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: heds-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: heds-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://heds_user:heds_secure_password@postgres:5432/heds_db
      SYNC_DATABASE_URL: postgresql://heds_user:heds_secure_password@postgres:5432/heds_db
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/storage_data
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:8000"]'
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage_data

  student-web:
    build:
      context: apps/student-web
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    container_name: heds-student-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  shop-dashboard:
    build:
      context: apps/shop-dashboard
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    container_name: heds-shop-dashboard
    restart: always
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pg_data:
  minio_data:
  storage_data:
