services:
  postgres:
    image: postgres:16-alpine
    container_name: heds-postgres
    restart: always
    environment:
      POSTGRES_USER: heds_user
      POSTGRES_PASSWORD: heds_secure_password
      POSTGRES_DB: heds_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heds_user -d heds_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: heds-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://heds_user:heds_secure_password@postgres:5432/heds_db
      SYNC_DATABASE_URL: postgresql://heds_user:heds_secure_password@postgres:5432/heds_db
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/storage_data
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:8000"]'
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage_data

  student-web:
    build:
      context: apps/student-web
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    container_name: heds-student-web
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 3000

  shop-dashboard:
    build:
      context: apps/shop-dashboard
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    container_name: heds-shop-dashboard
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 3000

  edge-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: heds-edge-agent
    restart: always
    depends_on:
      - backend
    environment:
      HEDS_CLOUD_URL: http://backend:8000
      HEDS_AGENT_KEY: agent-dev-key-12345
      HEDS_SHOP_ID: b52a6ecb-5dbc-4e41-a8cb-88f05f68859a
      HEDS_AGENT_ID: 467674bf-343b-4484-adde-efc923c87db3
      HEDS_PRINTER_ADAPTER: mock

volumes:
  pg_data:
  storage_data:
